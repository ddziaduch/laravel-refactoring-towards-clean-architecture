services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_XDEBUG: ${INSTALL_XDEBUG:-true}
    init: true
    ports:
      - "${APP_PORT:-8001}:8000"
    volumes:
      - .:/opt/project
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: client_host=host.docker.internal
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16-alpine
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app} -d ${DB_DATABASE:-app}"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./docker/postgres/create-test-database.sh:/docker-entrypoint-initdb.d/10-create-test-database.sh:ro

volumes:
  database_data:
