deptrac:
  paths:
    - ./app
    - ./src
  layers:
    - name: Domain
      collectors:
        - type: classNameRegex
          value: '#^Clean\\Domain\\#'
    - name: Application
      collectors:
        - type: classNameRegex
          value: '#^Clean\\Application\\#'
    - name: Adapter
      collectors:
        - type: classNameRegex
          value: '#^Clean\\Adapter\\#'
    - name: Framework
      collectors:
        - type: classNameRegex
          value: '#^(App|Illuminate|Symfony|Tymon)\\#'
  ruleset:
    Domain: ~
    Application:
      - Domain
    Adapter:
      - Domain
      - Application
      - Framework
    Framework:
      - Domain
      - Application
      - Adapter
